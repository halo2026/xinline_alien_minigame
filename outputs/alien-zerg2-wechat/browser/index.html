<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>异星要塞 · 关卡选择</title><style>*{box-sizing:border-box}body{margin:0;background:#080e13;height:100dvh;display:grid;place-items:center}canvas{height:100dvh;width:100vw;touch-action:none}iframe{border:0;width:100vw;height:100dvh;display:none}button{position:fixed;right:9px;top:42px;background:#162e3de8;border:1px solid #688592;color:#e5d6aa;padding:6px 10px;display:none;z-index:2}</style><canvas id="menu"></canvas><iframe id="stage" title="游戏关卡"></iframe><button id="back">战役选择</button><script src="../shared/viewing-vip.js"></script><script src="../shared/viewing-vip-ui.js"></script><script src="../shared/loading-screen.js"></script><script src="loading-cover.js"></script><script src="../shared/level-data.js"></script><script src="../shared/art-data.js"></script><script src="../shared/vehicle-gear.js"></script><script src="../shared/socket-tech.js"></script><script src="../shared/socket-ui.js"></script><script src="../shared/bestiary-data.js"></script><script src="../shared/bestiary.js"></script><script src="../shared/progression.js"></script><script src="../shared/tactics.js"></script><script src="../shared/zerg4-boss-art.js"></script><script src="../shared/zerg4-boss.js"></script><script src="../shared/tank-mantis-art.js"></script><script src="../shared/tank-mantis.js"></script><script src="../shared/equipment-fusion.js"></script><script src="../shared/insect-nest-art.js"></script><script src="../shared/insect-nests.js"></script><script src="../shared/mail-monsters-art.js"></script><script src="../shared/mail-monsters.js"></script><script src="../shared/defense-art.js"></script><script src="../shared/mechanical-snake-art.js"></script><script src="../shared/mechanical-enemies.js"></script><script src="../shared/core.js"></script><script src="../shared/store.js"></script><script src="../shared/responsive.js"></script><script src="../shared/space-scene.js"></script><script src="../shared/battle-intro.js"></script><script src="../shared/combat-hints.js"></script><script src="../shared/view.js"></script><script src="../shared/build-info.js"></script><script src="../shared/mission-menu.js"></script><script>
(async()=>{
const canvas=document.querySelector('canvas'),frame=document.querySelector('iframe'),back=document.querySelector('button'),dpr=Math.min(2,devicePixelRatio||1),ctx=canvas.getContext('2d');
const storage={load:()=>localStorage.getItem(ZergProgress.KEY),save:data=>localStorage.setItem(ZergProgress.KEY,JSON.stringify(data))};
const images=await ZergView.load(()=>new Image(),f=>'../assets/'+f,window.launchProgress);window.finishLaunchCover();
const imageFile=f=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src='../assets/'+f;});
[images.campaignSpace,images.campaignNodes,images.campaignNebula]=await Promise.all([imageFile('campaign-space.jpg'),imageFile('campaign-nodes.png'),imageFile('campaign-nebula.jpg')]);
const v=new ZergView.View(ctx,images,420,900,0,storage);let currentMission=null;
function selectMission(id){menu.onResume=null;currentMission=id;frame.src=id==='zerg'?'zerg.html':id+'.html';canvas.style.display='none';frame.style.display='block';back.style.display=ZergProgress.campaignSelectionUnlocked(v.game.progress)?'block':'none';}
const menu=new AlienMissions.MissionMenu(v,id=>{v.flushSave(true);selectMission(id);});
frame.onload=()=>{const bind=()=>{if(!currentMission)return;const child=frame.contentWindow.view;if(!child){setTimeout(bind,50);return;}if(!ZergProgress.campaignSelectionUnlocked(child.game.progress))child.game.start();child.onExitCampaign=()=>back.onclick();child.onNextCampaign=id=>{child.flushSave(true);selectMission(id);};};bind();};
const resize=()=>{canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);v.resize(innerWidth,innerHeight,0);menu.scroll=Math.min(menu.scroll,menu.geometry().max);menu.draw();};window.addEventListener('resize',resize);resize();
const point=e=>{const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*v.w/r.width,(e.clientY-r.top)*v.h/r.height];};
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);menu.down(...point(e));};canvas.onpointermove=e=>{menu.move(...point(e));menu.draw();};canvas.onpointerup=e=>{menu.up(...point(e));menu.draw();};canvas.onpointercancel=()=>{menu.drag=null;};canvas.onwheel=e=>{e.preventDefault();menu.wheel(e.deltaY||e.deltaX);menu.draw();};
const saveClear=()=>{if(!currentMission)return;try{const child=frame.contentWindow.view;if(child){if(AlienMissions.recordClear(child.game,currentMission))child.flushSave(true);back.style.display=child.game.state!=='lost'&&ZergProgress.campaignSelectionUnlocked(child.game.progress)?'block':'none';}}catch(e){console.error(e);}};
setInterval(saveClear,500);
let lastMenuFrame=0;function animateMenu(t){if(!currentMission&&!document.hidden&&t-lastMenuFrame>=33){menu.draw();lastMenuFrame=t;}requestAnimationFrame(animateMenu);}requestAnimationFrame(animateMenu);
back.onclick=()=>{saveClear();const id=currentMission,child=frame.contentWindow.view;child?.flushSave(true);const resumable=child?.game.state==='playing';if(resumable){child.paused=true;child.onSound?.('musicPause');frame.contentWindow.campaignSuspended=true;menu.onResume=()=>{currentMission=id;frame.contentWindow.campaignSuspended=false;child.paused=false;frame.style.display='block';canvas.style.display='none';back.style.display=child.game.state!=='lost'&&ZergProgress.campaignSelectionUnlocked(child.game.progress)?'block':'none';menu.onResume=null;};}else{menu.onResume=null;frame.src='about:blank';}currentMission=null;frame.style.display='none';back.style.display='none';canvas.style.display='block';v.game.progress=ZergProgress.restore(storage.load());menu.draw();};
if(!new URLSearchParams(location.search).has('campaigns')&&!ZergProgress.campaignSelectionUnlocked(v.game.progress))selectMission(v.game.progress.campaignClears?.zerg?(v.game.progress.campaignClears?.mine4?'zerg1':'mine4'):'zerg');
})().catch(console.error);
</script></html>
