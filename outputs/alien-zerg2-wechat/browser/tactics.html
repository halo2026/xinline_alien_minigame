<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>异虫 · 战术卡效果测试</title>
<style>body{margin:0;background:#0e171d;color:#d2e1df;font:15px system-ui;display:flex;justify-content:center;gap:22px;padding:16px}aside{width:260px}h1{font-size:21px;color:#ebd5a4}button,select{width:100%;padding:12px;margin:6px 0;background:#293d48;color:#f1e8d1;border:1px solid #6c8893;border-radius:4px}canvas{width:min(390px,100vw);height:auto;max-height:calc(100vh - 32px);object-fit:contain}p{line-height:1.6;color:#9db3bb}#status{white-space:pre-line;font-size:16px;line-height:1.8}@media(max-width:650px){body{display:block;padding:0}aside{width:auto;padding:12px}canvas{max-height:none;width:100%}}</style>
<aside><h1>战术技能卡 · 效果测试</h1><p>独立测试场景，不读取或修改玩家存档。目标包括地面怪、飞龙与首领。</p><select id="card"></select><button id="drop">掉落所选卡片</button><button id="cast">释放所选技能</button><button id="reset">重置目标与能量</button><div id="status">载入原版资源…</div><p>卡片落在战车附近，由游戏的接近拾取逻辑收取。重复掉落可检查次数叠加；点击右侧卡图标也可释放。</p><a href="./" style="color:#8fcdda">返回正常关卡</a></aside><canvas width="780" height="1688"></canvas>
<script src="../shared/campaign-order.js"></script><script src="../shared/viewing-vip.js"></script><script src="../shared/viewing-vip-ui.js"></script><script src="../shared/art-data.js"></script><script src="../shared/level-data.js"></script><script src="../shared/vehicle-gear.js"></script><script src="../shared/socket-tech.js"></script><script src="../shared/socket-ui.js"></script><script src="../shared/bestiary-data.js"></script><script src="../shared/bestiary.js"></script><script src="../shared/progression.js"></script><script src="../shared/tactics.js"></script><script src="../shared/zerg4-boss-art.js"></script><script src="../shared/zerg4-boss.js"></script><script src="../shared/tank-mantis-art.js"></script><script src="../shared/tank-mantis.js"></script><script src="../shared/equipment-fusion.js"></script><script src="../shared/insect-nest-art.js"></script><script src="../shared/insect-nests.js"></script><script src="../shared/mail-monsters-art.js"></script><script src="../shared/mail-monsters.js"></script><script src="../shared/defense-art.js"></script><script src="../shared/mechanical-snake-art.js"></script><script src="../shared/mechanical-enemies.js"></script><script src="../shared/core.js"></script><script src="../shared/battle-intro.js"></script><script src="../shared/combat-hints.js"></script><script src="../shared/view.js"></script>
<script>
(async()=>{const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.scale(2,2);const images=await ZergView.load(()=>new Image(),f=>'../assets/'+f);const view=new ZergView.View(ctx,images,390,844);const sel=document.querySelector('#card');for(const [id,c]of Object.entries(ZergArt.tactical.cards)){const o=document.createElement('option');o.value=id;o.textContent=c.name.replace('道具技能-','');sel.append(o);}function reset(){view.game=new ZergCore.Game({seed:28});const g=view.game;g.start();g.pending=[];g.nextWave=Infinity;g.yoda.hp=0;Object.assign(g.player,{x:900,y:1100,angle:-Math.PI/2,fireCd:Infinity,energyRegen:0});for(let i=0;i<12;i++){const e=g.spawn({unit:i===11?12504:i===10?12509:12501,spawn:1,path:1});Object.assign(e,{x:900+(i%4-1.5)*85,y:850+Math.floor(i/4)*90,hp:100000,maxHp:100000,speed:0,damage:0,cd:Infinity,skillCd:Infinity,range:0});}view.paused=false;}
reset();document.querySelector('#drop').onclick=()=>{const g=view.game;g.pickups.push({id:Number(sel.value),x:g.player.x+28,y:g.player.y,born:g.time,pickupAfter:g.time+.6});};document.querySelector('#cast').onclick=()=>view.game.useCard(Number(sel.value));document.querySelector('#reset').onclick=reset;
const xy=e=>{const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*390/r.width,(e.clientY-r.top)*844/r.height];};canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);view.down(e.pointerId,...xy(e));};canvas.onpointermove=e=>view.motion(e.pointerId,...xy(e));canvas.onpointerup=e=>view.up(e.pointerId,...xy(e));canvas.onpointercancel=e=>view.up(e.pointerId,undefined,undefined,true);
let prev=performance.now();function loop(t){view.step(Math.min(.05,(t-prev)/1000));prev=t;view.draw();const g=view.game,q=g.cards[sel.value];document.querySelector('#status').textContent=`能量 ${g.player.energy.toFixed(0)} / ${g.player.maxEnergy}\n持有次数 ${q?.count||0}\n冷却 ${Math.max(0,(q?.ready||0)-g.time).toFixed(1)} 秒\n累计释放 ${g.cardCasts.length} 次\n目标受到伤害 ${g.enemies.reduce((n,e)=>n+e.maxHp-e.hp,0).toFixed(0)}`;requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script>
